<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>

  <!-- Font from Google Fonts (needs internet; falls back to a normal font offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- 1. COLORS (change these to restyle the whole game) ---------- */
    :root {
      --bg: #2a1a3e;          /* page background */
      --panel: #38254f;       /* cards and buttons */
      --tile: #47306a;        /* board squares */
      --tile-hover: #573a80;
      --text: #f4eefc;
      --muted: #b9a8d6;
      --x: #5ad1ff;           /* X color */
      --o: #ffc83d;           /* O color */
      --win: #7dffb0;         /* winning line */
    }

    /* ---------- 2. PAGE LAYOUT ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Fredoka", "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px 40px;
    }

    .game {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
    }
    h1 .x { color: var(--x); }
    h1 .o { color: var(--o); }

    /* ---------- 3. MODE + LEVEL BUTTONS ---------- */
    .row {
      display: flex;
      gap: 8px;
    }
    .row button {
      flex: 1;
      padding: 10px 8px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .row button:hover { background: var(--tile); }
    .row button.active {
      color: var(--text);
      border-color: var(--text);
      background: var(--tile);
    }

    .group-label {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    #levelBox.hidden { display: none; }

    /* ---------- 4. SCOREBOARD ---------- */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .score {
      background: var(--panel);
      border-radius: 14px;
      padding: 12px 6px;
      text-align: center;
    }
    .score .name { font-size: .8rem; color: var(--muted); }
    .score .num  { font-size: 2rem; font-weight: 700; line-height: 1.2; }
    .score.x .num { color: var(--x); }
    .score.o .num { color: var(--o); }

    /* ---------- 5. STATUS TEXT ---------- */
    #status {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 500;
      min-height: 1.6em;
    }

    /* ---------- 6. BOARD ---------- */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .cell {
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 18px;
      background: var(--tile);
      font: inherit;
      font-size: clamp(3rem, 16vw, 4.8rem);
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .cell:hover:not(:disabled) { background: var(--tile-hover); }
    .cell:active:not(:disabled) { transform: scale(.96); }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win {
      background: var(--win);
      color: var(--bg);
      animation: pop .35s ease;
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* ---------- 7. BOTTOM BUTTONS ---------- */
    .actions button {
      font-weight: 700;
      color: var(--text);
    }
    .actions .primary { background: var(--x); color: var(--bg); }
    .actions .primary:hover { background: #82ddff; }

    :focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1><span class="x">Tic</span> Tac <span class="o">Toe</span></h1>

    <!-- Choose who to play against -->
    <div>
      <p class="group-label">Play against</p>
      <div class="row" id="modeRow">
        <button data-mode="cpu" class="active">Computer</button>
        <button data-mode="friend">A friend</button>
      </div>
    </div>

    <!-- Choose level (only shown when playing the computer) -->
    <div id="levelBox">
      <p class="group-label">Level</p>
      <div class="row" id="levelRow">
        <button data-level="easy" class="active">Easy</button>
        <button data-level="hard">Hard</button>
      </div>
    </div>

    <!-- Scoreboard -->
    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score x"><div class="name" id="nameX">You (X)</div><div class="num" id="scoreX">0</div></div>
      <div class="score"><div class="name">Draws</div><div class="num" id="scoreD">0</div></div>
      <div class="score o"><div class="name" id="nameO">Computer (O)</div><div class="num" id="scoreO">0</div></div>
    </section>

    <p id="status" aria-live="polite"></p>

    <!-- Board: the 9 buttons are created by JavaScript below -->
    <section class="board" id="board" aria-label="Game board"></section>

    <div class="row actions">
      <button class="primary" id="newRound">New round</button>
      <button id="resetScores">Reset scores</button>
    </div>
  </main>

  <script>
    // ---------- 1. GAME DATA ----------
    // The board is a list of 9 items: "X", "O" or "" (empty).
    // Positions:  0 1 2
    //             3 4 5
    //             6 7 8
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],   // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8],   // columns
      [0, 4, 8], [2, 4, 6]               // diagonals
    ];

    let board = Array(9).fill("");
    let current = "X";          // whose turn it is
    let gameOver = false;
    let thinking = false;       // true while the computer "thinks"
    let mode = "cpu";           // "cpu" or "friend"
    let level = "easy";         // "easy" or "hard"

    // Separate scoreboard for each: easy, hard, friend
    let scores = {
      "cpu-easy": { x: 0, o: 0, d: 0 },
      "cpu-hard": { x: 0, o: 0, d: 0 },
      "friend":   { x: 0, o: 0, d: 0 }
    };

    // Load saved scores (so they stay after refreshing the page)
    try {
      const saved = JSON.parse(localStorage.getItem("ttt-scores"));
      if (saved) scores = saved;
    } catch (e) { /* ignore if storage is blocked */ }

    // ---------- 2. GRAB PAGE ELEMENTS ----------
    const boardEl  = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const levelBox = document.getElementById("levelBox");

    // Create the 9 squares
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement("button");
      btn.className = "cell";
      btn.setAttribute("aria-label", "Square " + (i + 1));
      btn.addEventListener("click", () => playerClick(i));
      boardEl.appendChild(btn);
    }
    const cells = boardEl.querySelectorAll(".cell");

    // ---------- 3. HELPER FUNCTIONS ----------
    function scoreKey() {
      return mode === "cpu" ? "cpu-" + level : "friend";
    }

    // Returns { mark, line } if someone has won, otherwise null
    function checkWinner(b) {
      for (const line of WIN_LINES) {
        const [a, c, d] = line;
        if (b[a] && b[a] === b[c] && b[a] === b[d]) {
          return { mark: b[a], line };
        }
      }
      return null;
    }

    function isFull(b) {
      return b.every(cell => cell !== "");
    }

    // ---------- 4. DRAWING THE SCREEN ----------
    function render() {
      const win = checkWinner(board);
      cells.forEach((cell, i) => {
        cell.textContent = board[i];
        cell.className = "cell" + (board[i] ? " " + board[i].toLowerCase() : "");
        if (win && win.line.includes(i)) cell.classList.add("win");
        cell.disabled = gameOver || board[i] !== "" || thinking;
      });

      const s = scores[scoreKey()];
      document.getElementById("scoreX").textContent = s.x;
      document.getElementById("scoreD").textContent = s.d;
      document.getElementById("scoreO").textContent = s.o;
      document.getElementById("nameX").textContent = mode === "cpu" ? "You (X)" : "Player X";
      document.getElementById("nameO").textContent = mode === "cpu" ? "Computer (O)" : "Player O";
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function saveScores() {
      try { localStorage.setItem("ttt-scores", JSON.stringify(scores)); } catch (e) {}
    }

    // ---------- 5. PLAYING A MOVE ----------
    function playerClick(i) {
      if (gameOver || thinking || board[i] !== "") return;
      makeMove(i);

      // If playing the computer and the game continues, computer plays next
      if (!gameOver && mode === "cpu" && current === "O") {
        thinking = true;
        setStatus("Computer is thinking...");
        render();
        setTimeout(() => {
          makeMove(computerChoice());
          thinking = false;
          render();
        }, 450);
      }
    }

    function makeMove(i) {
      board[i] = current;
      const win = checkWinner(board);
      const s = scores[scoreKey()];

      if (win) {
        gameOver = true;
        s[win.mark.toLowerCase()]++;
        if (mode === "cpu") {
          setStatus(win.mark === "X" ? "You win! 🎉" : "Computer wins.");
        } else {
          setStatus("Player " + win.mark + " wins! 🎉");
        }
        saveScores();
      } else if (isFull(board)) {
        gameOver = true;
        s.d++;
        setStatus("It's a draw.");
        saveScores();
      } else {
        current = current === "X" ? "O" : "X";
        if (mode === "cpu") {
          setStatus(current === "X" ? "Your turn" : "Computer's turn");
        } else {
          setStatus("Player " + current + "'s turn");
        }
      }
      render();
    }

    // ---------- 6. THE COMPUTER'S BRAIN ----------
    function computerChoice() {
      const empty = [];
      board.forEach((v, i) => { if (v === "") empty.push(i); });

      if (level === "easy") {
        // EASY: just picks any empty square at random
        return empty[Math.floor(Math.random() * empty.length)];
      }

      // HARD: tries every possible future (minimax) and picks the best move.
      // On hard, the computer can never lose.
      let bestScore = -Infinity;
      let bestMove = empty[0];
      for (const i of empty) {
        board[i] = "O";
        const score = minimax(board, 0, false);
        board[i] = "";
        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }
      return bestMove;
    }

    // isComputerTurn = true  -> computer (O) wants the HIGHEST score
    // isComputerTurn = false -> human (X) wants the LOWEST score
    function minimax(b, depth, isComputerTurn) {
      const win = checkWinner(b);
      if (win) return win.mark === "O" ? 10 - depth : depth - 10;
      if (isFull(b)) return 0;

      let best = isComputerTurn ? -Infinity : Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] !== "") continue;
        b[i] = isComputerTurn ? "O" : "X";
        const score = minimax(b, depth + 1, !isComputerTurn);
        b[i] = "";
        best = isComputerTurn ? Math.max(best, score) : Math.min(best, score);
      }
      return best;
    }

    // ---------- 7. BUTTONS ----------
    function newRound() {
      board = Array(9).fill("");
      current = "X";
      gameOver = false;
      thinking = false;
      setStatus(mode === "cpu" ? "Your turn" : "Player X's turn");
      render();
    }

    document.getElementById("newRound").addEventListener("click", newRound);

    document.getElementById("resetScores").addEventListener("click", () => {
      scores[scoreKey()] = { x: 0, o: 0, d: 0 };
      saveScores();
      newRound();
    });

    document.getElementById("modeRow").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      mode = btn.dataset.mode;
      document.querySelectorAll("#modeRow button").forEach(b => b.classList.toggle("active", b === btn));
      levelBox.classList.toggle("hidden", mode !== "cpu");
      newRound();
    });

    document.getElementById("levelRow").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      level = btn.dataset.level;
      document.querySelectorAll("#levelRow button").forEach(b => b.classList.toggle("active", b === btn));
      newRound();
    });

    // Start the first game
    newRound();
  </script>
</body>
</html>
